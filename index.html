    // ① 本次倒水直接把目标管倒满 4 块同色；② 连续 3 次操作无报错。
    // 每次动作最多响一次；playbackRate 1.15 + preservesPitch=false → 升调更奶
    cleanStreak++;
    if (completedTube) {
      // 归类成功的庆祝音在下方 completedTube 分支播 purrAudio，
      // 哼唧彩蛋让位——两种猫叫同时响会糊成一团
      cleanStreak = 0;
    } else if (cleanStreak >= 3) {
      cleanStreak = 0;
      playClip(hmmAudio, 0.3, 1.15);
    }

    // —— 全部落地后：通关反馈 / 被压委屈脸 ——
    if (completedTube && toEl) {
      // 整管 4 只猫集体 ^ω^ 庆祝脸 + 金色光晕 + 爱心粒子 + 呼噜庆祝
      setFace(toEl.querySelectorAll('.face'), '^ω^', 1000);
      toEl.classList.remove('dimmed');   // 压暗的 brightness(0.7) 与金光同属 filter，摘掉避免互相干扰
      toEl.classList.add('gold-glow');
      setTimeout(() => toEl.classList.remove('gold-glow'), 1000);
      spawnHearts(toEl, 4);   // 管口喷 4 个爱心
      playCompleteChime();   // 归类庆祝：合成上行"叮咚"三连音，避免 MP3 单调复读
      // —— 满管快乐抖动：4 只猫整齐地像软糖一样颤两下（scale 弹跳 + 微扭）——
      // 用 Web Animations API 直接作用在每只猫的 .layer 上，不覆盖 .gold-glow 的 filter 动画
      toEl.querySelectorAll('.layer').forEach((lyr, li) => {
        lyr.animate([
          { transform: 'scale(1, 1) rotate(0deg)' },
          { transform: 'scale(1.12, 0.92) rotate(-3deg)', offset: 0.20 },   /* 压扁左歪 */
          { transform: 'scale(0.92, 1.12) rotate(3deg)',  offset: 0.42 },   /* 弹高右歪 */
          { transform: 'scale(1.08, 0.95) rotate(-1.5deg)', offset: 0.62 }, /* 再压 */
          { transform: 'scale(0.98, 1.04) rotate(1deg)',  offset: 0.80 },   /* 再弹 */
          { transform: 'scale(1, 1) rotate(0deg)' }
        ], { duration: 520, delay: li * 40, easing: 'ease-out' });   /* 从下到上 40ms 错峰，像波浪 */
      });
    } else if (toEl && baseLayers >= 2 && Math.random() < 0.30) {
      // 被压在最底下的那只猫，30% 概率露出 >_< 委屈脸
      const bottomFace = toEl.firstElementChild?.querySelector('.face');
      if (bottomFace) setFace(bottomFace, '>_<', 500);
    }

    // 最后一次落地缓冲收尾后，按优先级依次检查终局：
    // ① 胜利 > ② 步数耗尽 > ③ 死局无路可走
    await wait(380);
    checkWin(completedTube ? to : null);   // 胜利时从刚完成的这管开始连锁点亮
    checkStepOverflow();
    checkDeadlock();
  } finally {
    isAnimating = false; // 兜底解锁：无论动画是否异常都不会卡死操作
  }

  /* 单块果冻的抛物线飞行（Web Animations API）——起跳蓄力 + 空中翻滚 + 落地开心脸 */
  async function flyOne(j) {
    await wait(j * 90);   // 逐块起飞节奏
    const r = startRects[j];

    // 翻滚方向：±1 随机，决定小猫向左还是向右翻
    const tiltDir = Math.random() < 0.5 ? 1 : -1;

    // 克隆体：脱离文档流的绝对定位果冻块（飞行途中带猫咪 PNG 与表情）
    const clone = document.createElement('div');
    clone.className = 'layer fly ' + topColor;
    clone.style.width  = layerW + 'px';
    clone.style.height = layerH + 'px';
    clone.style.background = catBg(topColor);
    clone.innerHTML = '<span class="face">' + faceHtml('•ω•') + '</span>';
    // 防闪帧根本手段：用 left/top（布局属性）把克隆体静态钉在源管起点。
    // 动画尚未生效的任何一帧，元素都画在源管上（与动画第 0 帧重合，肉眼无感），
    // 而不可能出现在 left:0,top:0 的屏幕左上角
    const ox = r.left, oy = r.top;
    clone.style.left = ox + 'px';
    clone.style.top  = oy + 'px';
    document.body.appendChild(clone);

    // 目标格：管内第 baseLayers + j 格（自下而上，含 2px 块间距）
    const slot = baseLayers + j;
    const slotX = tubeRect.left;
    const slotY = tubeRect.bottom - slot * (layerH + GAP) - layerH;
    // 管口落点：块底刚好没入玻璃口，无论管里已有几块，一律从管口往下放
    const mouthY = tubeRect.top - layerH + 4;

    // —— 轨迹两段式（transform 全部相对 left/top 基准，让小猫翻个跟头再回正）——
    const frames = [];
    // 起跳瞬间：先原地蓄力（不移动），轻微纵向拉伸像弹簧压缩
    frames.push({
      transform: `translate(0px, 0px) scale(0.85, 1.15) rotate(0deg)`,
      offset: 0
    });

    // ① 抛物线段：源管顶部 → 目标管口正上方，二次贝塞尔采样
    const STEPS = 8;
    const ctrlX = (r.left + slotX) / 2;
    const ctrlY = Math.min(r.top, mouthY) - 70 - Math.abs(slotX - r.left) * 0.08;
    for (let s = 0; s <= STEPS; s++) {
      const t = s / STEPS, inv = 1 - t;
      const px = inv * inv * r.left + 2 * inv * t * ctrlX + t * t * slotX;
      const py = inv * inv * r.top  + 2 * inv * t * ctrlY + t * t * mouthY;
      // sin(πt) 从 0→1→0，幅度 ±25° 像探头张望，保留萌态不翻过去
      const rot = tiltDir * 25 * Math.sin(t * Math.PI);
      // 高频微抖动：sin(t * π * 6) 每秒 6 次，幅度 ±4%，像果冻自己晃
      const wobble = Math.sin(t * Math.PI * 6) * 0.04;
      const sx = (1 + wobble).toFixed(3);
      const sy = (1 - wobble).toFixed(3);
      frames.push({
        transform: `translate(${(px - ox).toFixed(1)}px, ${(py - oy).toFixed(1)}px) rotate(${rot.toFixed(1)}deg) scale(${sx}, ${sy})`,
        offset: 0.03 + t * 0.52   // 起始 3% 留给蓄力帧
      });
    }

    // ② 下落段：从管口竖直坠入目标格，y 按 t² 加速，纵向逐渐拉伸
    const FALL = 4;
    for (let s = 1; s <= FALL; s++) {
      const t = s / FALL;
      const py = mouthY + (slotY - mouthY) * t * t;
      const scaleX = 1 - 0.06 * t;
      const scaleY = 1 + 0.10 * t;
      // 下落时探头回正，幅度同步衰减
      const rot = tiltDir * 25 * Math.sin(Math.PI + t * Math.PI) * (1 - t);
      frames.push({
        transform: `translate(${(slotX - ox).toFixed(1)}px, ${(py - oy).toFixed(1)}px) rotate(${rot.toFixed(1)}deg) scale(${scaleX.toFixed(2)}, ${scaleY.toFixed(2)})`,
        offset: 0.55 + 0.45 * t
      });
    }

    // fill:'both'：backwards fill 在动画 pending（startTime 未解析）阶段就钉住第 0 帧，
    // 配合 left/top 基准，任何时刻克隆体都只可能出现在正确位置
    const anim = clone.animate(frames, { duration: 440, fill: 'both' });

    try { await anim.finished; } catch (e) { /* 动画被中断也继续落地流程 */ }
    clone.remove();

    // —— 落地瞬间：真实果冻块补入目标管 DOM ——
    const layer = document.createElement('div');
    layer.className = 'layer ' + topColor;
    layer.style.background = catBg(topColor);
    layer.innerHTML = '<span class="face">' + faceHtml('•ω•') + '</span>';
    toEl.appendChild(layer);

    // 落地重量 w：目标管顶部连续同色段的长度（1 轻 → 4 满管）。
    // 注意不能直接用 baseLayers 或整管同色总数：目标管可能混色、底部还可能压着
    // 被隔开的散色（如 [蓝,红,蓝] 再倒蓝），只有顶部连续同色段才算"已归类"。
    // pour 后段长 = 原段长 + n，减去还在空中的 n-j-1 块 = 这块落地瞬间的段长
    let run = 0;
    for (let k = tubes[to].length - 1; k >= 0 && tubes[to][k] === topColor; k--) run++;
    const w = run - (n - j - 1);
    const wT = (w - 1) / 3;   // 归一化 0 → 1

    // 打击感三段式：瞬间压扁 → 保持 50ms（顿帧）→ 强力过冲回弹
    // 压扁幅度随重量：scale(1.12, 0.85) 轻 → scale(1.25, 0.70) 满管
    // 落地瞬间叠加 skewX 横向拉伸（软糖感）：砸实的一刻向两侧"流"开，回弹时收回
    const sx = 1.12 + wT * 0.13;
    const sy = 0.85 - wT * 0.15;
    const skewAmp = 6 + wT * 6;   // 横向拉伸幅度：6°（轻）→ 12°（满管）
    const skewDir = Math.random() < 0.5 ? 1 : -1;   /* 随机左/右歪，避免机械感 */
    layer.animate([
      { transform: `scale(${sx.toFixed(3)}, ${sy.toFixed(3)}) skewX(${skewDir * skewAmp}deg)`, offset: 0 },
      { transform: `scale(${sx.toFixed(3)}, ${sy.toFixed(3)}) skewX(${skewDir * skewAmp}deg)`, offset: 0.18, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' },
      { transform: `scale(0.95, 1.06) skewX(${-skewDir * skewAmp * 0.4}deg)`, offset: 0.62, easing: 'ease-out' },
      { transform: 'scale(1, 1) skewX(0deg)', offset: 1 }
    ], { duration: 280, easing: 'linear' });   // 280ms × 0.18 ≈ 50ms 顿帧保持

    // 落地开心脸：这块小猫变成 >ω< 眯眼开心 300ms
    const face = layer.querySelector('.face');
    if (face) setFace(face, '>ω<', 300);

    // 整管液面"下压 → 回弹"缓冲
    bounceTube(toEl);
    // 管口上方飞溅同色粒子：3 个（轻）→ 6 个（满管）
    spawnParticles(toEl, topColor, 2 + w);
    // 落地音效：清脆的"啵"声（逐块音高上行），音量 0.3（轻）→ 0.6（满管）
    playSound('pour', j, 0.3 + wT * 0.3);
    // 整屏震动：0.3（轻）→ 1.0（满管），满管那一下比旧版统一 0.55 更有"砸实"感
    shakeScreen(0.3 + wT * 0.7);
  }
}

function pour(from, to) {
  const fromTop = tubes[from][tubes[from].length - 1];
  while (
    tubes[from].length > 0 &&
    tubes[from][tubes[from].length - 1] === fromTop &&
    tubes[to].length < TUBE_CAP
  ) {
    tubes[to].push(tubes[from].pop());
  }
}

// ============ 胜利判定 ============
// lastDone：本次倒水刚归类完成的管号（连锁庆祝从它开始点亮），无则传 null
function checkWin(lastDone) {
  // 严格胜利：每个试管要么空，要么装满且同色
  const win = tubes.every(tube =>
    tube.length === 0 ||
    (tube.length === TUBE_CAP && tube.every(c => c === tube[0]))
  );
  if (!win) return;

  gameOver = true;   // 赢了也锁定，防止继续倒水
  setBestSteps(level, steps);   // 更新本关最佳步数（只保留更小的）
  if (targetSteps === 0) setStars(level, calcStars(steps));   // 仅简单模式存历史最高星

  // 解锁下一关：取最大值，永不回退（选关只覆盖当前 level，不会污染这里）
  const unlocked = level + 1;
  if (unlocked > maxUnlockedLevel) {
    maxUnlockedLevel = unlocked;
    saveMaxLevel();
  }

  // —— 通关连锁庆祝：一管一管点亮，而不是全部同时"轰"一声 ——
  // 从最后归类完成的那管开始，每隔 200ms 点亮下一管满色管：
  // 金色光晕脉冲 + 猫咪集体跳一下（scaleY 1.1）+ 喷 2 个爱心 + 音高上行的"啵"
  const fullIdx = tubes
    .map((t, i) => (t.length === TUBE_CAP && t.every(c => c === t[0])) ? i : -1)
    .filter(i => i >= 0);
  const order = (typeof lastDone === 'number' && fullIdx.includes(lastDone))
    ? [lastDone, ...fullIdx.filter(i => i !== lastDone)]
    : fullIdx;

  order.forEach((ti, k) => {
    setTimeout(() => {
      // 连锁期间玩家点了"重开/选关"→ 新关卡已开始（gameOver 被重置），放弃残留节拍
      if (!gameOver) return;
      const el = tubeEl(ti);
      if (!el) return;
      // 重新触发光晕脉冲（最后一管可能还带着完成时的 gold-glow，先摘再戴强制重播）
      el.classList.remove('dimmed');   // 金光属于 filter，压暗也是 filter，摘掉防盖
      el.classList.remove('gold-glow');
      void el.offsetWidth;
      el.classList.add('gold-glow');
      // 整管猫咪从下到上依次跳一下（层层 40ms 小错峰，像波浪）
      el.querySelectorAll('.layer').forEach((layer, li) => {
        layer.animate([
          { transform: 'translateY(0) scale(1, 1)' },
          { transform: 'translateY(-7px) scale(0.95, 1.1)', offset: 0.4 },
          { transform: 'translateY(0) scale(1, 1)' }
        ], { duration: 300, delay: li * 40, easing: 'ease-out' });
      });
      spawnHearts(el, 2);          // 管口喷 2 个爱心
      playSound('pour', k, 0.4);   // 音高逐管上行，"哒哒哒哒"的节奏
    }, k * 200);
  });

  // 连锁跑完再上胜利音乐 + 弹窗，节奏不断档
  const chainDur = Math.max(0, (order.length - 1) * 200) + 380;
  setTimeout(() => {
    if (!gameOver) return;   // 连锁期间被重开/换关，弹窗不再出场
    playSound('win');
    showWinModal();
  }, chainDur);
}

// ============ 困难模式步数耗尽判定 ============
function checkStepOverflow() {
  if (targetSteps <= 0) return;                // 简单模式不判定
  if (gameOver) return;                       // 赢了不判输
  if (steps > targetSteps) {
    gameOver = true;
    showLoseModal('steps');
  }
}

// ============ 死局检测：是否还有任意一步合法倒水 ============
// 遍历所有试管两两配对，存在 canPour(i,j) 则返回 true
// 若没有合法操作且未通关，判死局 → 失败
function checkDeadlock() {
  if (gameOver) return;                       // 已经在终局了不重复判
  const n = tubes.length;
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      if (i !== j && canPour(i, j)) return;   // 还有合法操作，没事
    }
  }
  // 全遍历完没找到任何合法操作 → 死局
  gameOver = true;
  showLoseModal('deadlock');
}

// ============ 失败弹窗（两种失败原因复用同一套 UI）============
function showLoseModal(reason) {
  document.querySelectorAll('.win-overlay').forEach(el => el.remove());

  let mainText, subText;
  if (reason === 'deadlock') {
    mainText = '无路可走啦！';
    subText  = '再倒一步都不行啦，猫咪先歇会儿～';
  } else {
    mainText = '步数用尽，猫咪卡住了！';
    subText  = `已用 ${steps} 步，上限 ${targetSteps} 步`;
  }

  const overlay = document.createElement('div');
  overlay.className = 'win-overlay lose-overlay';
  overlay.innerHTML = `
    <div class="win-card lose-card">
      <h2>(=；ω；=)</h2>
      <p>${mainText}</p>
      <p style="font-size:12px;opacity:0.65;margin-top:8px;color:#ffc3c3;">
        ${subText}
      </p>
      <button class="btn btn-primary" style="margin-top:20px;" onclick="restartLevel()">
        再来一次
      </button>
    </div>
  `;
  document.body.appendChild(overlay);
}

// ============ 通关弹窗 + 彩带（防重叠）============
function showWinModal() {
  // 先清空上一批彩带和弹窗
  document.querySelectorAll('.confetti').forEach(el => el.remove());
  document.querySelectorAll('.win-overlay').forEach(el => el.remove());

  const best  = getBestSteps(level);
  const hard  = targetSteps > 0;
  const modeLabel = endlessMode
    ? `♾️ 无尽模式 · 目标 ${targetSteps} 步`
    : (hard ? `困难模式 · 目标 ${targetSteps} 步` : `简单模式 · ${colorCount} 色`);

  let extra = '';
  if (hard) {
    // 困难模式：只有步数对比，不评星（步数限制本身就是奖励）
    extra = `<div class="win-stats">
      <span>🐾 用 ${steps} 步（限制 ${targetSteps}）</span>
      ${best > 0 && best !== steps ? `<span>最佳 ${best} 步</span>` : `<span>🏆 新纪录！</span>`}
    </div>`;
  } else {
    // 简单模式：完整星级 + 门槛 + 历史最高
    const stars = calcStars(steps);
    const hist  = getStars(level);
    const starsStr = Array.from({length: 3}, (_, i) => i < stars ? '⭐' : '☆').join('');
    const histStr  = Array.from({length: 3}, (_, i) => i < hist  ? '⭐' : '☆').join('');
    const t = starThresholds();
    const thr = `3⭐≤${t.three}步　2⭐≤${t.two}步`;
    extra = `
      <div class="win-stars">${starsStr}</div>
      <div class="win-thresholds">${thr}</div>
      <div class="win-stats">
        <span>🐾 用 ${steps} 步</span>
        ${best > 0 && best !== steps ? `<span>最佳 ${best} 步</span>` : (steps === best ? `<span>🏆 新纪录！</span>` : '')}
      </div>
      ${hist >= 1 ? `<div class="win-history">历史最高：${histStr}</div>` : ''}
    `;
  }

  const overlay = document.createElement('div');
  overlay.className = 'win-overlay';
  overlay.innerHTML = `
    <div class="win-card">
      <h2>(=^･ｪ･^=) Meow!</h2>
      <p>第 ${level} 关通过 · ${modeLabel}</p>
      ${extra}
    </div>
  `;
  document.body.appendChild(overlay);

  // 生成彩带
  const colors = ['#ff6b6b', '#4dabf7', '#51cf66', '#ffd43b', '#cc5de8', '#ff922b'];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (1 + Math.random() * 1.5) + 's';
    c.style.animationDelay = Math.random() * 0.5 + 's';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    document.body.appendChild(c);
  }

  // 展示 2.2 秒后进入下一关；若刚通关主线终点（第 15 关），改弹无尽模式入口
  setTimeout(() => {
    overlay.remove();
    document.querySelectorAll('.confetti').forEach(el => el.remove());
    if (level === MAIN_LINE_END && !endlessMode) {
      showEndlessEntryModal();
    } else {
      initLevel(level + 1);
    }
  }, 2200);
}

// ============ 主线通关 → 无尽模式入口弹窗 ============
function showEndlessEntryModal() {
  const overlay = document.createElement('div');
  overlay.className = 'win-overlay';
  overlay.innerHTML = `
    <div class="win-card">
      <h2>(=^･ｪ･^=) 主线通关啦！</h2>
      <p>前方是高能的无尽挑战，猫咪种类与限制步数将完全随机。是否进入？</p>
      <div class="endless-actions">
        <button class="jelly-btn" id="enterEndlessBtn" type="button">进入无尽模式</button>
        <button class="btn btn-secondary" id="backToPickerBtn" type="button">退回选关</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelector('#enterEndlessBtn').addEventListener('click', () => {
    overlay.remove();
    // 第 16 关起进入无尽：colorCount / targetSteps 全随机
    initLevel(level + 1);
  });
  overlay.querySelector('#backToPickerBtn').addEventListener('click', () => {
    overlay.remove();
    showLevelPicker();
  });
}

// ============ 选关面板 ============
// 根据当前 level 决定可解锁的关卡范围：
// - LEVELS 固定关卡（前 10 关）全部可选
// - 困难模式 >10：只允许选 <= 当前 level 的关卡（避免跳关生成未见过的盘面）
//   不过也可以让玩家选已解锁的——取 max(10, level) 作为上限
function showLevelPicker() {
  if (isAnimating || isEntering) return;
  resetLoveTimer();   // 打开选关面板 → 打断空闲计时
  document.querySelectorAll('.level-picker').forEach(el => el.remove());

  // 最大可选关卡 = 历史最大解锁关卡（不允许跳到没打过的关卡，
  // 但已通关的关卡永远可选——选关不会覆盖这里，所以不会"回锁"）
  const maxPick = maxUnlockedLevel;

  // —— 主线关卡：1 ~ MAIN_LINE_END，用 5 列方格网格 ——
  let gridHtml = '';
  for (let i = 1; i <= MAIN_LINE_END; i++) {
    const cls = i === level ? 'level-btn current' : 'level-btn';
    const disabled = i > maxPick ? 'disabled' : '';
    const s = getStars(i);
    const starStr = s > 0
      ? Array.from({length: 3}, (_, k) => k < s ? '★' : '☆').join('')
      : '';
    const starHtml = starStr ? `<span class="btn-stars">${starStr}</span>` : '';
    gridHtml += `<button class="${cls}" ${disabled} onclick="gotoLevel(${i})"><span>${i}</span>${starHtml}</button>`;
  }

  // —— 无尽模式：单个长条卡片，呈现"连续挑战"的感觉 ——
  // N = 当前无尽进度（已解锁的最高无尽关序号），刚解锁时为 1
  const endlessN = maxPick - MAIN_LINE_END;
  let endlessHtml = '';
  if (endlessN >= 1) {
    const targetLv = MAIN_LINE_END + endlessN;   // 点击直接跳到当前进度对应的无尽关
    endlessHtml = `
      <button class="endless-card" onclick="gotoLevel(${targetLv})">
        <span class="endless-card-icon">∞</span>
        <span class="endless-card-text">无尽模式 · 当前挑战第 ${endlessN} 关</span>
      </button>`;
  } else {
    // 还没通关第 15 关：锁定态，不可点击
    endlessHtml = `
      <div class="endless-card locked">
        <span class="endless-card-icon">🔒</span>
        <span class="endless-card-text">通关第 15 关解锁无尽模式</span>
      </div>`;
  }

  const overlay = document.createElement('div');
  overlay.className = 'level-picker';
  overlay.innerHTML = `
    <div class="level-picker-card">
      <h3>🐾 选 择 关 卡</h3>
      <div class="level-grid">${gridHtml}</div>
      ${endlessHtml}
      <button class="level-picker-close" onclick="closeLevelPicker()">关闭</button>
    </div>
  `;
  document.body.appendChild(overlay);
}

function closeLevelPicker() {
  document.querySelectorAll('.level-picker').forEach(el => el.remove());
}

function gotoLevel(n) {
  closeLevelPicker();
  if (isAnimating || isEntering) return;
  if (n > maxUnlockedLevel) return;   // 防线：禁止跳到未解锁关卡（按钮已 disabled，此处兜底）
  meltAway(() => initLevel(n));   // 旧盘面先融化，再进新关
}

// ============ 重开本关 ============
function restartLevel() {
  if (isAnimating || isEntering) return;
  meltAway(() => initLevel(level, null, true));   // 无尽关：复用缓存盘面，不重新随机
}

// ============ 撤销一步 ============
// 恢复上一次倒水前的 tubes/steps 状态；失败/胜利弹窗后禁用；
// 游戏结束时也禁用（步数超了就是超了，不能靠撤销擦屁股）。
// 视觉不是"啪"一下瞬移：对比 lastState 与当前 tubes 找出被倒走的那 n 块，
// 让它们从目标管抛物线飞回源管（flyOne 同一套两段式轨迹，方向相反），落地后才 render 最终态
async function undoStep() {
  if (isAnimating || isEntering || gameOver) return;
  if (!lastState) return;
  resetLoveTimer();

  // —— 对比找出"倒回去"的三要素 ——
  // src：当前比 lastState 多了 n 块的管（倒水时的目标，要把块吐回去）
  // dst：当前比 lastState 少的管（倒水时的源，要接回这些块）
  let src = -1, dst = -1;
  for (let i = 0; i < tubes.length; i++) {
    const diff = tubes[i].length - lastState.tubes[i].length;
    if (diff > 0) src = i;
    else if (diff < 0) dst = i;
  }
  const n = src >= 0 ? tubes[src].length - lastState.tubes[src].length : 0;
  const color = src >= 0 ? tubes[src][tubes[src].length - 1] : null;

  // 找不到差异（理论上不会发生）→ 退化为原来的瞬移回滚
  if (src < 0 || dst < 0 || n <= 0 || !color) { applyUndo(); return; }

  isAnimating = true;
  selected = null;
  // 撤销按钮立刻禁用，防止动画期间连点
  const ub0 = document.getElementById('undoBtn');
  if (ub0) ub0.disabled = true;

  try {
    // —— 数据回滚前：测量起飞坐标（src 管顶部 n 块的屏幕位置）——
    const srcEl = tubeEl(src);
    const srcLayers = srcEl.querySelectorAll('.layer');
    const startRects = [];
    const srcLen = tubes[src].length;
    for (let j = 0; j < n; j++) {
      startRects.push(srcLayers[srcLen - n + j].getBoundingClientRect());
    }

    // —— 数据先行回滚（与 tryPour 同一原则：数据先行、视觉后补）——
    // 回滚后 dst 管顶部 n 块就是"飞回中"的块 → render 时压制不显示；
    // src 管立刻变短，旧位置的块由飞行克隆体接管（和倒水时源管块消失同理）
    tubes = lastState.tubes;
    steps = lastState.steps;
    level = lastState.level;
    targetSteps = lastState.targetSteps;
    lastState = null;           // 单步撤销，撤完就没了
    render({ hideTop: { tube: dst, count: n } });
    updateStepsUI();
    saveState();

    // render 重建了 DOM，必须重新获取节点、重测几何（同 tryPour 的教训）
    const dstEl = tubeEl(dst);
    const dstRect = dstEl.getBoundingClientRect();
    const GAP = 2;
    const dstStyle = getComputedStyle(dstEl);
    const layerH = (dstEl.clientHeight
                    - parseFloat(dstStyle.paddingTop)
                    - parseFloat(dstStyle.paddingBottom)) * 0.25 - 2;
    const layerW = dstEl.clientWidth;
    const baseLayers = tubes[dst].length - n;   // 回滚后 dst 管可见块数（飞回块落在其上）

    // 逐块飞回（间隔 90ms，与倒水同节奏），等待全部回家
    try {
      const flights = [];
      for (let j = 0; j < n; j++) flights.push(flyBack(j));
      await Promise.all(flights);
    } catch (e) {
      // 飞行异常不致命：继续走下面的最终 render——
      // 绝不能让 hideTop 压制的果冻块因为一次动画异常就永久从画面消失
    }

    await wait(120);
    render();   // 落地缓冲收尾后，render 最终态（清掉 hideTop 压制与临时 DOM）
  } catch (e) {
    render();   // 兜底：任何中断都用已回滚的数据重渲染，保证画面与数据一致
    // 若异常发生在回滚之前（lastState 还在），把撤销按钮恢复可用，别把撤销通道锁死
    if (lastState) {
      const ub = document.getElementById('undoBtn');
      if (ub) ub.disabled = false;
    }
  } finally {
    isAnimating = false;
  }

  /* 单块果冻飞回源管：与 flyOne 相同的两段式抛物线（方向相反），
     落地即时补真实 DOM + 果冻 squash + 粒子 + "啵"声 */
  async function flyBack(j) {
    await wait(j * 90);
    const r = startRects[j];
    const tiltDir = Math.random() < 0.5 ? 1 : -1;

    const clone = document.createElement('div');
    clone.className = 'layer fly ' + color;
    clone.style.width  = layerW + 'px';
    clone.style.height = layerH + 'px';
    clone.style.background = catBg(color);
    clone.innerHTML = '<span class="face">' + faceHtml('•ω•') + '</span>';
    // 同 flyOne：left/top 静态钉在源管起点，动画未生效时也不会画到屏幕左上角
    const ox = r.left, oy = r.top;
    clone.style.left = ox + 'px';
    clone.style.top  = oy + 'px';
    document.body.appendChild(clone);

    const slot  = baseLayers + j;
    const slotX = dstRect.left;
    const slotY = dstRect.bottom - slot * (layerH + GAP) - layerH;
    const mouthY = dstRect.top - layerH + 4;

    const frames = [];
    frames.push({
      transform: `translate(0px, 0px) scale(0.85, 1.15) rotate(0deg)`,
      offset: 0
    });
    const STEPS = 8;
    const ctrlX = (r.left + slotX) / 2;
    const ctrlY = Math.min(r.top, mouthY) - 70 - Math.abs(slotX - r.left) * 0.08;
    for (let s = 0; s <= STEPS; s++) {
      const t = s / STEPS, inv = 1 - t;
      const px = inv * inv * r.left + 2 * inv * t * ctrlX + t * t * slotX;
      const py = inv * inv * r.top  + 2 * inv * t * ctrlY + t * t * mouthY;
      const rot = tiltDir * 25 * Math.sin(t * Math.PI);
      const wobble = Math.sin(t * Math.PI * 6) * 0.04;
      frames.push({
        transform: `translate(${(px - ox).toFixed(1)}px, ${(py - oy).toFixed(1)}px) rotate(${rot.toFixed(1)}deg) scale(${(1 + wobble).toFixed(3)}, ${(1 - wobble).toFixed(3)})`,
        offset: 0.03 + t * 0.52
      });
    }
    const FALL = 4;
    for (let s = 1; s <= FALL; s++) {
      const t = s / FALL;
      const py = mouthY + (slotY - mouthY) * t * t;
      const rot = tiltDir * 25 * Math.sin(Math.PI + t * Math.PI) * (1 - t);
      frames.push({
        transform: `translate(${(slotX - ox).toFixed(1)}px, ${(py - oy).toFixed(1)}px) rotate(${rot.toFixed(1)}deg) scale(${(1 - 0.06 * t).toFixed(2)}, ${(1 + 0.10 * t).toFixed(2)})`,
        offset: 0.55 + 0.45 * t
      });
    }

    // fill:'both' + left/top 基准：动画 pending 阶段也只在源管位置显示
    const anim = clone.animate(frames, { duration: 440, fill: 'both' });
    try { await anim.finished; } catch (e) { /* 中断也继续落地流程 */ }
    clone.remove();

    // 落地：真实果冻块补回源管 DOM
    const layer = document.createElement('div');
    layer.className = 'layer ' + color;
    layer.style.background = catBg(color);
    layer.innerHTML = '<span class="face">' + faceHtml('•ω•') + '</span>';
    dstEl.appendChild(layer);
    layer.animate([
      { transform: 'scale(1.2, 0.8)', offset: 0 },
      { transform: 'scale(1.2, 0.8)', offset: 0.18, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' },
      { transform: 'scale(0.95, 1.06)', offset: 0.62, easing: 'ease-out' },
      { transform: 'scale(1, 1)', offset: 1 }
    ], { duration: 280, easing: 'linear' });
    const face = layer.querySelector('.face');
    if (face) setFace(face, '>ω<', 300);   // 回家也开心一下
    bounceTube(dstEl);
    spawnParticles(dstEl, color, 3);
    playSound('pour', j, 0.35);
  }
}

/* 无动画的瞬时回滚（兜底：找不到倒回差异时才走这里） */
function applyUndo() {
  tubes = lastState.tubes;
  steps = lastState.steps;
  level = lastState.level;
  targetSteps = lastState.targetSteps;
  lastState = null;
  selected = null;
  render();
  updateStepsUI();
  saveState();
  const ub = document.getElementById('undoBtn');
  if (ub) ub.disabled = true;
}

// ============ 启动 ============
// 优先从存档恢复上次进度，否则从第 1 关开始
const saved = loadState();
// 最大解锁关卡：取 localStorage 与存档当前 level 的较大值，
// 兼容旧存档（没有 MAX_LEVEL_KEY 时用 saved.level 兜底，老玩家不会一夜回锁）
maxUnlockedLevel = Math.max(loadMaxLevel(), saved ? saved.level : 1);
if (saved) {
  initLevel(saved.level, { tubes: saved.tubes, steps: saved.steps, targetSteps: saved.targetSteps });
} else {
  initLevel(1);
}
initPaws();

// 首次进入（没有任何存档、也没看过引导）→ 欢迎弹窗；看完记录标记，之后不再打扰
let seenWelcome = false;
try { seenWelcome = !!localStorage.getItem(WELCOME_KEY); } catch (e) {}
if (!saved && !seenWelcome) showWelcome();

// ============ 全局音频解锁 ============
// iOS 微信/Safari 的铁律：必须由真实用户手势触发才允许出声。
// 第一次 pointerdown 时一次性把 Web Audio 与 HTML5 Audio 都"点着"，之后 playClip 才不会静默失败
document.addEventListener('pointerdown', function unlockAudio() {
  // ① 激活 Web Audio：resume 必须发生在手势回调内
  try {
    if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { /* 音频不可用不影响游戏 */ }
  // ② 用一段 0 音量的静音 wav 解锁 HTML5 Audio（iOS 只认"真实播放过"的元素）
  try {
    const silent = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
    silent.volume = 0;
    const p = silent.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) { /* 忽略 */ }
  // ④ 移动端：顺手把运动传感器权限要了（iOS 13+ 必须由用户手势触发）。
  //    老玩家不再弹欢迎弹窗，必须在这里兜底——否则摇一摇对他们永远是死的。
  //    安卓不需要权限，requestMotionPermission 内部对非 iOS 直接挂监听。
  if (window.isMobileDevice && window.isMobileDevice()) {
    try { window.requestMotionPermission && window.requestMotionPermission(); } catch (e) {}
  }
  // ⑤ 解锁后立刻移除监听，不干扰后续操作
  document.removeEventListener('pointerdown', unlockAudio);
}, { once: true });
</script>
